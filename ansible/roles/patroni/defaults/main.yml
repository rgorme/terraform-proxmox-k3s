patroni_restapi_port: 8008
patroni_restapi_user: patroni
patroni_replication_user: replicator
patroni_data_dir: "{{ postgresql_ha_data_dir }}"
patroni_bin_dir: "/usr/lib/postgresql/{{ postgresql_ha_version }}/bin"

# Applied at bootstrap (bootstrap.dcs) and kept in the dynamic configuration
# afterwards (tasks/dcs-parameters.yml). Changes to parameters that need a
# restart show up as "Pending restart" in patronictl list.
patroni_postgresql_parameters:
  max_connections: 200
  shared_buffers: 512MB
  effective_cache_size: 1536MB
  wal_level: replica
  hot_standby: "on"
  max_wal_senders: 10
  max_replication_slots: 10
  wal_keep_size: 1GB
  wal_log_hints: "on"
  password_encryption: scram-sha-256

# OS locales the databases need. authentik, netbox and planka were created with
# da_DK.UTF-8 on the old server; both nodes need it or CREATE DATABASE and
# queries on those databases fail.
patroni_os_locales:
  - da_DK.UTF-8
