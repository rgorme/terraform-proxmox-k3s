---
# pg01/pg02 push WAL to the repository host over SSH as postgres -> pgbackrest,
# and the repository host runs backups over SSH as pgbackrest -> postgres.
- name: Set the pgBackRest role of this host
  ansible.builtin.set_fact:
    pgbackrest_is_repo: "{{ inventory_hostname == pgbackrest_repo_host }}"
    pgbackrest_user: "{{ pgbackrest_repo_user if inventory_hostname == pgbackrest_repo_host else 'postgres' }}"

- name: Install repository prerequisites
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - ca-certificates
      - python3-debian
    state: present

# pgBackRest must be the same version on every host, so all of them (the
# witness too) take it from PGDG rather than Debian.
- name: Add the PostgreSQL (PGDG) apt repository
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: main
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Install pgBackRest
  ansible.builtin.apt:
    update_cache: true
    name: pgbackrest
    state: present

- name: Create the pgBackRest repository group
  ansible.builtin.group:
    name: "{{ pgbackrest_repo_user }}"
    system: true
  when: pgbackrest_is_repo

- name: Create the pgBackRest repository user
  ansible.builtin.user:
    name: "{{ pgbackrest_repo_user }}"
    group: "{{ pgbackrest_repo_user }}"
    system: true
    shell: /bin/bash
    home: "/home/{{ pgbackrest_repo_user }}"
    create_home: true
  when: pgbackrest_is_repo

- name: Generate an SSH key for the pgBackRest user
  ansible.builtin.user:
    name: "{{ pgbackrest_user }}"
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_comment: "{{ pgbackrest_user }}@{{ inventory_hostname }} (pgbackrest)"
  register: pgbackrest_user_info

- name: Create the pgBackRest directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pgbackrest_user }}"
    group: "{{ pgbackrest_user }}"
    mode: '0750'
  loop: >-
    {{ ['/var/log/pgbackrest']
       + ([pgbackrest_repo_path] if pgbackrest_is_repo else ['/var/spool/pgbackrest']) }}

- name: Read this host's SSH keys
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ pgbackrest_user_info.home }}/.ssh/id_ed25519.pub"
    - /etc/ssh/ssh_host_ed25519_key.pub
  register: pgbackrest_keys

- name: Remember this host's SSH keys
  ansible.builtin.set_fact:
    pgbackrest_user_pubkey: "{{ (pgbackrest_keys.results[0].content | b64decode).split()[:2] | join(' ') }}"
    pgbackrest_host_pubkey: "{{ (pgbackrest_keys.results[1].content | b64decode).split()[:2] | join(' ') }}"

# The peers of the repository host are the PostgreSQL hosts, and the peer of a
# PostgreSQL host is the repository host.
- name: Set the SSH peers of this host
  ansible.builtin.set_fact:
    pgbackrest_peers: "{{ groups['postgresql'] if pgbackrest_is_repo else [pgbackrest_repo_host] }}"

- name: Authorize the peers' pgBackRest keys
  ansible.posix.authorized_key:
    user: "{{ pgbackrest_user }}"
    key: "{{ hostvars[item].pgbackrest_user_pubkey }}"
    key_options: >-
      from="{{ hostvars[item].ansible_host }}",no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-pty
    state: present
  loop: "{{ pgbackrest_peers }}"

- name: Trust the peers' SSH host keys
  ansible.builtin.known_hosts:
    path: "{{ pgbackrest_user_info.home }}/.ssh/known_hosts"
    name: "{{ hostvars[item].ansible_host }}"
    key: "{{ hostvars[item].ansible_host }} {{ hostvars[item].pgbackrest_host_pubkey }}"
    state: present
  loop: "{{ pgbackrest_peers }}"

- name: Give the pgBackRest user its known_hosts file
  ansible.builtin.file:
    path: "{{ pgbackrest_user_info.home }}/.ssh/known_hosts"
    owner: "{{ pgbackrest_user }}"
    group: "{{ pgbackrest_user }}"
    mode: '0644'

- name: Create the pgBackRest configuration directory
  ansible.builtin.file:
    path: /etc/pgbackrest
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure pgBackRest
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: root
    group: "{{ pgbackrest_user }}"
    mode: '0640'

# pgBackRest only reads /etc/pgbackrest.conf (the Debian package's stub) when
# /etc/pgbackrest/pgbackrest.conf is missing. Remove it to avoid confusion.
- name: Remove the packaged configuration stub
  ansible.builtin.file:
    path: /etc/pgbackrest.conf
    state: absent

# stanza-create only needs the primary running, not WAL archiving. runuser
# instead of become_user, which would need acl or pipelining on the container.
- name: Create the pgBackRest stanza
  ansible.builtin.command:
    cmd: runuser -u {{ pgbackrest_repo_user }} -- pgbackrest --stanza={{ pgbackrest_stanza }} stanza-create
    creates: "{{ pgbackrest_repo_path }}/backup/{{ pgbackrest_stanza }}/backup.info"
  when: pgbackrest_is_repo

- name: Install the pgBackRest backup service
  ansible.builtin.template:
    src: pgbackrest-backup@.service.j2
    dest: /etc/systemd/system/pgbackrest-backup@.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd
  when: pgbackrest_is_repo

- name: Install the pgBackRest backup timers
  ansible.builtin.template:
    src: pgbackrest-backup.timer.j2
    dest: "/etc/systemd/system/pgbackrest-{{ item.type }}.timer"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { type: full, schedule: "{{ pgbackrest_full_schedule }}" }
    - { type: diff, schedule: "{{ pgbackrest_diff_schedule }}" }
  notify: Reload systemd
  when: pgbackrest_is_repo

- name: Reload systemd before enabling the timers
  ansible.builtin.meta: flush_handlers

- name: Enable the pgBackRest backup timers
  ansible.builtin.systemd_service:
    name: "pgbackrest-{{ item }}.timer"
    state: started
    enabled: true
  loop: [full, diff]
  when: pgbackrest_is_repo

# bootstrap.dcs in config.yml only applies when the cluster is first created,
# so WAL archiving goes into the running cluster's dynamic configuration (what
# patronictl edit-config changes). Any Patroni node serves it.
- name: Read Patroni's dynamic configuration
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pgbackrest_patroni_restapi_port }}/config"
    url_username: "{{ pgbackrest_patroni_restapi_user }}"
    url_password: "{{ postgresql_ha_restapi_password }}"
    force_basic_auth: true
    return_content: true
  register: pgbackrest_dcs
  delegate_to: "{{ groups['postgresql'][0] }}"
  run_once: true

- name: Enable WAL archiving in Patroni's dynamic configuration
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pgbackrest_patroni_restapi_port }}/config"
    method: PATCH
    url_username: "{{ pgbackrest_patroni_restapi_user }}"
    url_password: "{{ postgresql_ha_restapi_password }}"
    force_basic_auth: true
    body_format: json
    body:
      postgresql:
        parameters: "{{ pgbackrest_patroni_parameters }}"
  delegate_to: "{{ groups['postgresql'][0] }}"
  run_once: true
  changed_when: true
  when: >-
    (pgbackrest_dcs.json.postgresql.parameters | default({}))
    | dict2items | selectattr('key', 'in', pgbackrest_patroni_parameters.keys() | list)
    | items2dict != pgbackrest_patroni_parameters
