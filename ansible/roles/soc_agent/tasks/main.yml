---
# SOC/ops agent container: host baseline, then the agent (code, venv,
# credentials, systemd timer).
- name: Install packages for the agent runtime
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - ca-certificates
      - curl
      - git
      - python3
      - python3-venv
      - unattended-upgrades
    state: present

# The container is reachable only from the LAN, but it reads attacker-controlled
# input (logs, CVE texts), so security updates go in without waiting for us.
- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# The agent runs as its own unprivileged user, never as root.
- name: Create the agent user
  ansible.builtin.user:
    name: soc-agent
    system: true
    shell: /usr/sbin/nologin
    home: /opt/soc-agent
    create_home: true

# Credentials (Grafana, GitHub, Anthropic) will live here, readable only by
# the agent user.
- name: Create the credentials directory
  ansible.builtin.file:
    path: /etc/soc-agent
    state: directory
    owner: root
    group: soc-agent
    mode: "0750"

# ---------------------------------------------------------------- the agent

- name: Copy the agent and its requirements
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../soc-agent/{{ item }}"
    dest: /opt/soc-agent/{{ item }}
    owner: root
    group: soc-agent
    mode: "0644"
  loop:
    - soc_agent.py
    - requirements.txt
  register: soc_agent_files

# Owned by root, so the agent cannot change its own code or dependencies.
- name: Install the agent's Python dependencies
  ansible.builtin.pip:
    requirements: /opt/soc-agent/requirements.txt
    virtualenv: /opt/soc-agent/venv
    virtualenv_command: python3 -m venv
  when: soc_agent_files is changed

- name: Check that the Anthropic federation ids are filled in
  ansible.builtin.assert:
    that:
      - soc_agent_anthropic_federation_rule_id is match('^fdrl_')
      - soc_agent_anthropic_organization_id is match('^[0-9a-f-]{36}$')
      - soc_agent_github_app_client_id is match('^Iv')
    fail_msg: Set the federation ids and the GitHub App client id in group_vars/soc_agent.yml.

- name: Write the agent's credentials
  ansible.builtin.template:
    src: env.j2
    dest: /etc/soc-agent/env
    owner: root
    group: soc-agent
    mode: "0640"
  no_log: true

- name: Write the GitHub App private key
  ansible.builtin.copy:
    content: "{{ soc_agent_github_app_private_key }}"
    dest: /etc/soc-agent/github-app.pem
    owner: root
    group: soc-agent
    mode: "0640"
  no_log: true

- name: Install the systemd service and daily timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - soc-agent.service
    - soc-agent.timer
  notify: Reload systemd

- name: Enable the daily timer
  ansible.builtin.systemd_service:
    name: soc-agent.timer
    enabled: true
    state: started
    daemon_reload: true
