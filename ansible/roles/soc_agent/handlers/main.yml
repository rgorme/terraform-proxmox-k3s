---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# A changed OnCalendar only takes effect when the timer is restarted.
- name: Restart the timer
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - soc-agent.timer
    - soc-agent-watch.timer
