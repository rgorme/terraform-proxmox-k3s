---
# A member without the bootstrap marker is either part of the first bootstrap
# (no peer has a cluster yet) or a rebuilt member that must join the running
# cluster. A member that starts with ETCD_INITIAL_CLUSTER_STATE=new against a
# running cluster is refused, so ask the peers first. Only the members with the
# marker missing run this, so a first bootstrap still starts all three at once.

# The Debian package starts a single-node etcd on install. Its data directory
# would make this member ignore ETCD_INITIAL_CLUSTER, so remove it once.
- name: Stop the single-node etcd started by the package
  ansible.builtin.systemd_service:
    name: etcd
    state: stopped

- name: Remove the single-node etcd data
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: absent

# "member list" needs no credentials even with authentication on. The package
# etcd on a not yet configured peer listens on localhost only, so it does not
# answer here.
- name: Ask the other members whether a cluster already exists
  ansible.builtin.command:
    cmd: >-
      etcdctl --endpoints=http://{{ hostvars[item].ansible_host }}:{{ etcd_client_port }}
      --dial-timeout=3s --command-timeout=5s member list -w json
  environment:
    ETCDCTL_API: "3"
  loop: "{{ groups['etcd'] | difference([inventory_hostname]) }}"
  register: etcd_peer_member_lists
  failed_when: false
  changed_when: false

- name: Pick a peer that answered
  ansible.builtin.set_fact:
    etcd_join_peer: >-
      {{ etcd_peer_member_lists.results | selectattr('rc', 'equalto', 0)
         | map(attribute='item') | first | default('') }}

- name: Bootstrap a new cluster when no peer has one
  ansible.builtin.set_fact:
    etcd_initial_cluster_state: new
  when: etcd_join_peer == ''

- name: Join the existing cluster
  when: etcd_join_peer != ''
  block:
    - name: Use the peer that answered for membership changes
      ansible.builtin.set_fact:
        etcd_initial_cluster_state: existing
        etcd_join_endpoint: "http://{{ hostvars[etcd_join_peer].ansible_host }}:{{ etcd_client_port }}"
        etcd_join_members: >-
          {{ ((etcd_peer_member_lists.results | selectattr('item', 'equalto', etcd_join_peer) | first).stdout
             | from_json).members }}

    - name: Find out whether the peer requires credentials
      ansible.builtin.include_tasks: auth-status.yml
      vars:
        etcd_probe_endpoint: "{{ etcd_join_endpoint }}"

    # Membership changes need quorum, so the other two members must be up. An
    # entry left by this host (same name, or same peer URL after a manual
    # "member add") is removed first; etcd gives the new member a new ID.
    - name: Remove the old entry for this host from the cluster
      ansible.builtin.command:
        cmd: etcdctl --endpoints={{ etcd_join_endpoint }} member remove {{ '%x' | format(item.ID) }}
      environment: "{{ etcd_ctl_env }}"
      loop: "{{ etcd_join_members }}"
      loop_control:
        label: "{{ item.name | default(item.peerURLs | join(',')) }}"
      when: item.name | default('') == inventory_hostname or etcd_peer_url in item.peerURLs
      changed_when: true

    - name: Add this host to the cluster
      ansible.builtin.command:
        cmd: etcdctl --endpoints={{ etcd_join_endpoint }} member add {{ inventory_hostname }} --peer-urls={{ etcd_peer_url }}
      environment: "{{ etcd_ctl_env }}"
      changed_when: true
