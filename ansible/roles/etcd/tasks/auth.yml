---
# Users and roles for Patroni's DCS access, and the switch that turns
# authentication on. Included from the last play in setup-postgresql.yml, once
# Patroni on both nodes holds its credentials: "auth enable" applies to the
# whole cluster at once, and Patroni re-authenticates on its next DCS call.
# Until then a Patroni without credentials loses the DCS and the leader
# demotes after ttl (30 s). Every task runs once, on the first host in the play.
- name: Find out whether etcd authentication is already enabled
  ansible.builtin.include_tasks: auth-status.yml
  vars:
    etcd_probe_endpoint: "{{ etcd_endpoint }}"

- name: List the etcd users
  ansible.builtin.command:
    cmd: etcdctl --endpoints={{ etcd_endpoint }} user list
  environment: "{{ etcd_ctl_env }}"
  register: etcd_users
  changed_when: false
  run_once: true

- name: List the etcd roles
  ansible.builtin.command:
    cmd: etcdctl --endpoints={{ etcd_endpoint }} role list
  environment: "{{ etcd_ctl_env }}"
  register: etcd_roles
  changed_when: false
  run_once: true

# Passwords go in on stdin (--interactive=false), never on the command line,
# where every local user could read them from /proc while etcdctl runs.
- name: Create the etcd root user
  ansible.builtin.command:
    cmd: etcdctl --endpoints={{ etcd_endpoint }} user add root --interactive=false
    stdin: "{{ postgresql_ha_etcd_root_password }}"
  environment: "{{ etcd_ctl_env }}"
  when: "'root' not in etcd_users.stdout_lines"
  no_log: true
  changed_when: true
  run_once: true

# The grants run every time: etcd ignores a role that is already granted and a
# permission that is already set, and a run that was interrupted between
# "user add" and the grant must not leave root without the root role for good.
- name: Give the root user the root role
  ansible.builtin.command:
    cmd: etcdctl --endpoints={{ etcd_endpoint }} user grant-role root root
  environment: "{{ etcd_ctl_env }}"
  changed_when: false
  run_once: true

- name: Create the Patroni role
  ansible.builtin.command:
    cmd: etcdctl --endpoints={{ etcd_endpoint }} role add {{ etcd_patroni_user }}
  environment: "{{ etcd_ctl_env }}"
  when: etcd_patroni_user not in etcd_roles.stdout_lines
  changed_when: true
  run_once: true

- name: Let the Patroni role read and write its namespace
  ansible.builtin.command:
    cmd: >-
      etcdctl --endpoints={{ etcd_endpoint }} role grant-permission --prefix=true
      {{ etcd_patroni_user }} readwrite {{ etcd_patroni_prefix }}
  environment: "{{ etcd_ctl_env }}"
  changed_when: false
  run_once: true

- name: Create the Patroni user
  ansible.builtin.command:
    cmd: etcdctl --endpoints={{ etcd_endpoint }} user add {{ etcd_patroni_user }} --interactive=false
    stdin: "{{ postgresql_ha_etcd_password }}"
  environment: "{{ etcd_ctl_env }}"
  when: etcd_patroni_user not in etcd_users.stdout_lines
  no_log: true
  changed_when: true
  run_once: true

- name: Give the Patroni user the Patroni role
  ansible.builtin.command:
    cmd: etcdctl --endpoints={{ etcd_endpoint }} user grant-role {{ etcd_patroni_user }} {{ etcd_patroni_user }}
  environment: "{{ etcd_ctl_env }}"
  changed_when: false
  run_once: true

- name: Enable etcd authentication
  when: not etcd_auth_enabled | bool
  run_once: true
  block:
    # The switch applies to the whole cluster at once, so every Patroni must
    # already hold its credentials: check the file on disk on each PostgreSQL
    # host (also the ones left out with --limit), not just who is in the play.
    # The patroni role reloads Patroni whenever it writes this file.
    - name: Read Patroni's configuration on every PostgreSQL host
      ansible.builtin.slurp:
        src: /etc/patroni/config.yml
      delegate_to: "{{ item }}"
      loop: "{{ groups['postgresql'] }}"
      register: etcd_patroni_configs
      no_log: true

    - name: Make sure Patroni on every PostgreSQL host holds its etcd credentials
      ansible.builtin.assert:
        that:
          - >-
            etcd_patroni_configs.results | map(attribute='content') | map('b64decode')
            | select('search', '^\s*username: ' ~ etcd_patroni_user ~ '\s*$', multiline=true)
            | list | length == groups['postgresql'] | length
        fail_msg: >-
          /etc/patroni/config.yml lacks etcd3.username on at least one PostgreSQL
          host. Run the Patroni play first (setup-postgresql.yml without --limit
          and without --tags etcd_auth), then enable authentication.
        quiet: true

    - name: Turn etcd authentication on (whole cluster, takes effect at once)
      ansible.builtin.command:
        cmd: etcdctl --endpoints={{ etcd_endpoint }} auth enable
      environment: "{{ etcd_ctl_env }}"
      changed_when: true
