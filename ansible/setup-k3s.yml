---
# K3s settings live in /etc/rancher/k3s/config.yaml so re-running the official
# installer does not need to persist operational flags in a systemd unit.

- name: Configure K3s prerequisites
  hosts: all
  become: true
  gather_facts: true
  tags:
    - prerequisites
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - ca-certificates
          - curl
          - qemu-guest-agent
          - nfs-common
        state: present

    - name: Disable active swap
      ansible.builtin.command: swapoff -a
      when: ansible_facts['swaptotal_mb'] > 0
      changed_when: true

    - name: Disable swap in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        line: '# \1'
        state: present

    - name: Persist required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Load required kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure Kubernetes kernel parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-k3s.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply kernel parameters
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Start QEMU Guest Agent
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started
        enabled: true

# Longhorn runs only on the workers (the servers are tainted).
- name: Configure Longhorn node prerequisites
  hosts: k3s_workers
  become: true
  gather_facts: false
  tags:
    - longhorn
  tasks:
    - name: Install Longhorn packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - open-iscsi
          - nfs-common
          - cryptsetup
          - dmsetup
        state: present

    - name: Persist Longhorn kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/longhorn.conf
        mode: '0644'
        content: |
          iscsi_tcp
          dm_crypt

    - name: Load Longhorn kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - iscsi_tcp
        - dm_crypt

    - name: Start iscsid
      ansible.builtin.systemd_service:
        name: iscsid
        state: started
        enabled: true

    # Longhorn engines cache the iscsid PID when they start. If iscsid restarts
    # under them, their next detach cannot log out and leaves the iSCSI session
    # behind (longhorn/longhorn#13334, fixed in Longhorn 1.11.3). Keep
    # unattended upgrades from restarting iscsid until every volume runs a fixed
    # engine.
    - name: Create needrestart drop-in directory
      ansible.builtin.file:
        path: /etc/needrestart/conf.d
        state: directory
        mode: '0755'

    - name: Keep needrestart from restarting iscsid
      ansible.builtin.copy:
        dest: /etc/needrestart/conf.d/longhorn.conf
        mode: '0644'
        content: |
          # Restarting iscsid breaks detach for running Longhorn engines.
          $nrconf{override_rc}{qr(^iscsid)} = 0;

    - name: Keep unattended upgrades from upgrading open-iscsi
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51longhorn-unattended-upgrades
        mode: '0644'
        content: |
          // Upgrading open-iscsi restarts iscsid. Upgrade it with the node drained.
          Unattended-Upgrade::Package-Blacklist {
              "open-iscsi";
          };

    # multipathd can claim Longhorn's iSCSI devices, which breaks mount and
    # detach. These VMs have no multipath storage, so keep it off.
    - name: List multipath maps
      ansible.builtin.command: dmsetup ls --target multipath
      register: longhorn_multipath_maps
      changed_when: false

    - name: Stop if multipath already holds a device
      ansible.builtin.assert:
        that: longhorn_multipath_maps.stdout is search('No devices found')
        fail_msg: >-
          multipath maps exist on {{ inventory_hostname }}:
          {{ longhorn_multipath_maps.stdout }}. Release them by hand before
          disabling multipathd.

    - name: Create multipath drop-in directory
      ansible.builtin.file:
        path: /etc/multipath/conf.d
        state: directory
        mode: '0755'

    - name: Blacklist Longhorn devices in multipath
      ansible.builtin.copy:
        dest: /etc/multipath/conf.d/longhorn.conf
        mode: '0644'
        content: |
          blacklist {
              devnode "^sd[a-z0-9]+"
          }

    - name: Forget Longhorn WWIDs recorded by multipath
      ansible.builtin.lineinfile:
        path: /etc/multipath/wwids
        regexp: '^/360000000000000000e0000000'
        state: absent

    - name: Disable multipathd
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - multipathd.socket
        - multipathd.service

- name: Configure K3s servers
  hosts: k3s_masters
  serial: 1
  become: true
  # memtotal_mb sizes GOMEMLIMIT below.
  gather_facts: true
  vars_files:
    - secrets.yml
  # vars:
  #   k3s_version: "{{ k3s_version }}"
  #   k3s_api_endpoint: "{{ k3s_api_endpoint }}"
  #   k3s_api_endpoint_host: "{{ k3s_api_endpoint_host }}"
  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0700'

    - name: Configure K3s server
      ansible.builtin.template:
        src: k3s-server-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
      notify: Restart K3s server

    # The leading server's k3s process grows to most of the VM's memory. With
    # no swap the kernel then OOM-kills everything around it, the datastore
    # calls stall, leader election is lost and k3s exits. A soft Go memory
    # limit makes the runtime collect garbage harder before it gets that far.
    # A drop-in survives reinstalls; the installer rewrites k3s.service.env.
    - name: Create K3s server drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/k3s.service.d
        state: directory
        mode: '0755'

    - name: Limit the K3s server Go heap
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service.d/gomemlimit.conf
        mode: '0644'
        content: |
          [Service]
          Environment=GOMEMLIMIT={{ (ansible_facts['memtotal_mb'] * k3s_server_gomemlimit_ratio) | int }}MiB
      notify: Restart K3s server

    - name: Read installed K3s version
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: k3s_installed_version
      changed_when: false
      failed_when: false

    - name: Install pinned K3s server version
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        executable: /bin/sh
      environment:
        INSTALL_K3S_EXEC: server
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: k3s_version not in k3s_installed_version.stdout
      notify: Restart K3s server

    - name: Flush K3s server handlers
      ansible.builtin.meta: flush_handlers

    - name: Wait for the local K3s API
      ansible.builtin.uri:
        url: https://127.0.0.1:6443/healthz
        validate_certs: false
        status_code: 401
      register: k3s_api_health
      retries: 30
      delay: 10
      until: k3s_api_health.status == 401

  handlers:
    - name: Restart K3s server
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        enabled: true
        daemon_reload: true

- name: Configure K3s workers
  hosts: k3s_workers
  serial: 1
  become: true
  gather_facts: false
  vars_files:
    - secrets.yml
  vars:
    # k3s_version: "{{ k3s_version }}"
    # k3s_api_endpoint: "{{ k3s_api_endpoint }}"
  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0700'

    - name: Configure K3s agent
      ansible.builtin.template:
        src: k3s-agent-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
      notify: Restart K3s agent

    - name: Read installed K3s version
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: k3s_installed_version
      changed_when: false
      failed_when: false

    - name: Install pinned K3s agent version
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        executable: /bin/sh
      environment:
        INSTALL_K3S_EXEC: agent
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when:
        - k3s_installed_version.rc != 0 or
          k3s_version not in (k3s_installed_version.stdout | default(''))
      notify: Restart K3s agent

    - name: Flush K3s agent handlers
      ansible.builtin.meta: flush_handlers

    - name: Wait for worker to become Ready
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl get node {{ inventory_hostname }}
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ groups['k3s_masters'][0] }}"
      register: k3s_worker_ready
      changed_when: false
      retries: 30
      delay: 10
      until: k3s_worker_ready.stdout | trim == 'True'

    - debug:
        var: k3s_worker_ready

  handlers:
    - name: Restart K3s agent
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: restarted
        enabled: true
        daemon_reload: true