---
# etcd must form its cluster on all three members at once, so no serial here.
- name: Configure the etcd cluster for Patroni
  hosts: etcd
  become: true
  gather_facts: true
  vars_files:
    - secrets.yml
  roles:
    - etcd

# One host at a time: the first bootstraps the cluster as leader and the second
# clones from it. On later runs this also keeps one PostgreSQL host untouched.
- name: Configure PostgreSQL with Patroni
  hosts: postgresql
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - secrets.yml
  roles:
    - pgdg
    - patroni

# Backups: pgBackRest with WAL archiving to pg-witness. Runs without serial,
# since the hosts exchange SSH keys. It does not restart PostgreSQL: the first
# run leaves a pending restart for archive_mode (see the runbook, section 8).
- name: Configure pgBackRest backups
  hosts: postgresql_ha
  become: true
  gather_facts: true
  vars_files:
    - secrets.yml
  roles:
    - pgdg
    - pgbackrest
  tags: [pgbackrest]

# etcd authentication is turned on last, once Patroni on both nodes holds its
# credentials (the play above reloads it). It applies to the whole cluster at
# once; a Patroni without credentials would lose the DCS and demote after ttl.
# --skip-tags etcd_auth rolls out everything but the switch (see the runbook).
- name: Enable etcd authentication
  hosts: etcd
  become: true
  gather_facts: false
  vars_files:
    - secrets.yml
  tags: [etcd_auth]
  tasks:
    - name: Create the etcd users and enable authentication
      ansible.builtin.include_role:
        name: etcd
        tasks_from: auth
