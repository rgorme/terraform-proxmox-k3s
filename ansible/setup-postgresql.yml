---
# etcd must form its cluster on all three members at once, so no serial here.
- name: Configure the etcd cluster for Patroni
  hosts: etcd
  become: true
  gather_facts: true
  roles:
    - etcd

# One host at a time: the first bootstraps the cluster as leader and the second
# clones from it. On later runs this also keeps one PostgreSQL host untouched.
- name: Configure PostgreSQL with Patroni
  hosts: postgresql
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - secrets.yml
  roles:
    - pgdg
    - patroni

# Backups: pgBackRest with WAL archiving to pg-witness. Runs without serial,
# since the hosts exchange SSH keys. It does not restart PostgreSQL: the first
# run leaves a pending restart for archive_mode (see the runbook, section 8).
- name: Configure pgBackRest backups
  hosts: postgresql_ha
  become: true
  gather_facts: true
  vars_files:
    - secrets.yml
  roles:
    - pgdg
    - pgbackrest
  tags: [pgbackrest]
